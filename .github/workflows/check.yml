name: Build

on:
  push:
    branches: [main, test, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select JDK and install SDK packages
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:JAVA_HOME | ForEach-Object { "JAVA_HOME=$_" >> $env:GITHUB_ENV }
          "$env:JAVA_HOME/bin" >> $env:GITHUB_PATH
          $manager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $manager) { throw 'Android SDK command-line tools are missing' }
          & $manager.FullName 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Check repository contents and layout
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          ./scripts/check-layout.ps1
          python scripts/compatibility-inventory.py --check
      - name: Build release APK
        shell: pwsh
        run: ./build-local.ps1 -Sdk $env:ANDROID_HOME -Unsigned
      - name: Run JVM contracts
        shell: pwsh
        run: ./test-local.ps1 -Sdk $env:ANDROID_HOME -Suite Jvm -SkipBuild
      - name: Build signed debug APK
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'dressroom-debug.jks'
          keytool -genkeypair -keystore $key -alias alpha -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname 'CN=Dressroom CI Debug'
          if ($LASTEXITCODE -ne 0) { throw 'Debug key generation failed' }
          ./build-local.ps1 -Sdk $env:ANDROID_HOME -Debug -Keystore $key -BuildDir .build/debug
      - name: Collect APKs
        shell: pwsh
        run: |
          $release = Get-Item artifacts/current/*-unsigned.apk
          Rename-Item -LiteralPath $release.FullName -NewName ($release.Name -replace '-unsigned.apk$', '-release-unsigned.apk')
      - name: Upload APK ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dressroom-advanced-apks-${{ github.sha }}
          path: artifacts/current/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build summary
        if: success()
        shell: pwsh
        run: |
          foreach ($apk in Get-ChildItem artifacts/current/*.apk) {
            $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
            "- $($apk.Name): $hash" >> $env:GITHUB_STEP_SUMMARY
          }
          "The debug APK is signed with a per-run CI key. The release APK requires signing before installation." >> $env:GITHUB_STEP_SUMMARY
